services:
  fe-site:
    image: fe
    build:
      context: .
      target: site
    container_name: fe-site
    environment:
      - MONGO_URL=mongodb://mongodb-fe:27017
      - DOCKER=true
    depends_on:
      - mongodb
    ports:
      - "8080:8080"
    volumes:
      - site_data:/fe

  fe-tools:
    image: tools
    container_name: fe-tools
    environment:
      - DOCKER=true
    build:
      context: .
      target: tools
    ports:
      - "8082:8082"
    volumes:
      - tools_data:/tools

  mongodb:
    image: mongo:7.0
    container_name: mongodb-fe
    restart: on-failure
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

volumes:
  site_data:
  mongo_data:
  tools_data:
